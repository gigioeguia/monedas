<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogo de monedas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/movil.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/js/header.js" defer></script>
</head>

<body class="m-0 font-[Arial,sans-serif] text-[#d39e00] bg-[#5b5b5b]">

    <!-- Encabezado que permanece visible al hacer scroll -->
    <header id="main-header" class="fixed inset-x-0 top-0 z-50 h-screen overflow-hidden
           border-b border-neutral-600
           bg-[url('/image/moneda2.jpg')] bg-cover bg-center bg-no-repeat
           transition-[height] duration-300 ease-out">

        <div id="header-content" class="grid h-full grid-cols-1 grid-rows-[auto_auto] content-center
            items-center gap-3 px-4
            md:grid-cols-[minmax(0,1fr)_auto] md:grid-rows-1 md:gap-8
            md:px-8 lg:px-12">

            <!-- Primero en móvil; columna derecha en pantallas medianas y grandes -->
            <div class="flex items-center justify-center md:order-2 md:justify-end">
                <img id="header-logo" src="image/logo_trans.png" alt="Monedas Antiguas Eguia" class="w-48 max-w-[70vw] object-contain transition-[width] duration-500
                    md:w-40 lg:w-48">
            </div>

            <!-- Debajo del logo en móvil; columna izquierda en pantallas grandes -->
            <div class="flex min-w-0 items-center justify-center md:order-1 md:justify-start">
                <h1 id="header-title" class="w-full max-w-5xl text-center font-black uppercase leading-[1.05]
                   tracking-tight text-[#d39e00] transition-[font-size,transform] duration-500
                   md:text-left">
                    Valoramos su colección con<br>
                    <span class="text-[#ffce3a]">transparencia técnica,</span><br>
                    para que usted decida el siguiente paso con total seguridad.
                </h1>
            </div>

        </div>


    </header>
    <div id="header-spacer" class="h-[95vh]" aria-hidden="true"></div>

    <!-- El contenido sigue en el flujo normal del documento -->
    <main id="main-content" class="mx-auto max-w-[1200px] px-4 pt-12 pb-12">
        <h1 class="mb-5 text-2xl font-bold">Explora nuestras categorías</h1>

        <div class="swiper categorySwiper">
            <div id="categories-container" class="swiper-wrapper">
                <div class="swiper-slide">
                    <p class="text-center">Cargando categorías...</p>
                </div>
            </div>

            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>

            <div class="swiper-pagination mt-4"></div>
        </div>

        <section class="mt-12">

            <h2 id="category-title" class="text-2xl font-bold mb-6">
                Productos destacados
            </h2>

            <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

                <p class="text-center col-span-full">
                    Selecciona una categoría
                </p>

            </div>

        </section>

        <section class="grid grid-cols-1 gap-[18px] min-[601px]:grid-cols-2 min-[901px]:grid-cols-4" id="products"
            aria-label="Catálogo de productos" aria-live="polite">
            <p class="loading">Cargando productos…</p>
        </section>

    </main>

    <script>
        const productsContainer = document.querySelector('#products');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[character]);
        }

        async function loadProducts2() {
            try {
                const response = await fetch('/api/get_categories2.php');

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const products = await response.json();

                if (!Array.isArray(products) || products.length === 0) {
                    productsContainer.innerHTML = '<p>No hay productos disponibles.</p>';
                    return;
                }

                productsContainer.innerHTML = products.map(product => {
                    const name = escapeHtml(product.name);
                    const price = Number(product.price);
                    const image = escapeHtml(product.image_url || 'https://placehold.co/400x300?text=Producto');

                    return `
                    <article class="overflow-hidden rounded-lg bg-white shadow-[0_1px_4px_#00000014] transition-[transform,box-shadow] duration-200 hover:-translate-y-[3px] hover:shadow-[0_5px_14px_#0000001c]">
                        <img src="${image}" alt="${name}" loading="lazy" class="block h-[210px] w-full bg-white object-contain p-4">
                        <div class="border-t border-[#eee] p-4">
                        <p class="mb-2 text-2xl text-[#222]">
                            ${Number.isFinite(price)
                            ? price.toLocaleString('es-MX', {
                                style: 'currency',
                                currency: 'MXN'
                            })
                            : 'Precio no disponible'}
                        </p>
                        <p class="mb-2 text-sm font-bold text-[#16834b]">Envío gratis</p>
                        <h2 class="m-0 min-h-10 text-[15px] font-normal leading-[1.4]">${name}</h2>
                        </div>
                    </article>
                    `;
                }).join('');
            } catch (error) {
                console.error('No se pudieron cargar los productos:', error);
                productsContainer.innerHTML =
                    '<p>No fue posible cargar el catálogo. Intenta de nuevo más tarde.</p>';
            }
        }

        // Función para consumir el servicio PHP
        async function loadCategories() {
            const container = document.getElementById('categories-container');

            try {
                const response = await fetch('api/get_categories.php');
                const categories = await response.json();

                if (categories.error) throw new Error(categories.error);

                container.innerHTML = ''; // Limpiar mensaje de carga

                if (categories.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center">No hay categorías disponibles.</p>';
                    return;
                }

                categories.forEach(cat => {

                    const slide = document.createElement('div');

                    slide.className = 'swiper-slide';

                    slide.dataset.id = cat.id;

                    slide.innerHTML = `
                        <article class="overflow-hidden rounded-lg bg-white shadow-[0_1px_4px_#00000014] transition-[transform,box-shadow] duration-200 hover:-translate-y-[3px] hover:shadow-[0_5px_14px_#0000001c]">
                            ${cat.image_url
                            ? `<img
                                    src="${cat.image_url}"
                                    alt="${cat.name}"
                                    class="block h-[210px] w-full bg-white object-contain p-4"
                                >`
                            : ''}
                            <div class="border-t border-[#eee] p-4">
                                <h2 class="font-bold text-xl text-slate-800">
                                    ${cat.name}
                                </h2>

                                <p class="text-slate-600 mt-2">
                                    ${cat.description || ''}
                                </p>
                            </div>
                        </article>
                    `;
                    container.appendChild(slide);
                });

                const swiper = new Swiper('.categorySwiper', {

                    loop: true,
                    centeredSlides: true,

                    slidesPerView: 1,
                    spaceBetween: 30,

                    breakpoints: {
                        768: {
                            slidesPerView: 2
                        },
                        1200: {
                            slidesPerView: 3
                        }
                    },

                    effect: 'coverflow',

                    coverflowEffect: {
                        rotate: 0,
                        stretch: 0,
                        depth: 120,
                        modifier: 2,
                        slideShadows: false
                    },

                    pagination: {
                        el: '.swiper-pagination',
                        clickable: true
                    },

                    navigation: {
                        nextEl: '.swiper-button-next',
                        prevEl: '.swiper-button-prev'
                    },

                    on: {

                        init() {

                            const slide =
                                this.slides[this.activeIndex];

                            loadProducts(
                                slide.dataset.id
                            );

                        },

                        slideChangeTransitionEnd() {

                            const slide =
                                this.slides[this.activeIndex];

                            loadProducts(
                                slide.dataset.id
                            );

                        }

                    }

                });
            } catch (error) {
                container.innerHTML = `<p class="col-span-full text-center text-red-600">Error: ${error.message}</p>`;
            }
        }

        async function loadProducts(categoryId) {

            const container =
                document.getElementById('products-container');

            container.innerHTML = `
                <p class="col-span-full text-center">
                    Cargando artículos...
                </p>
            `;

            try {

                const response =
                    await fetch(
                        `api/get_products.php?category_id=${encodeURIComponent(categoryId)}`
                    );

                const products = await response.json();

                container.innerHTML = '';

                products.forEach(product => {

                    const card =
                        document.createElement('article');

                    card.className = `
                        bg-white
                        rounded-2xl
                        shadow-lg
                        overflow-hidden
                        hover:shadow-xl
                        transition
                    `;

                    card.innerHTML = `

                        ${product.image_url ? `
                            <img
                                src="${product.image_url}"
                                alt="${product.name}"
                                class="block h-[210px] w-full bg-white object-contain p-4">
                        ` : ''}

                        <div class="p-4">

                            <h3 class="font-bold text-lg">
                                ${product.name}
                            </h3>

                            <p class="text-slate-600 mt-2">
                                ${product.description || ''}
                            </p>

                            <p class="mt-4 text-xl font-bold text-blue-600">
                                $${product.price}
                            </p>

                        </div>
                    `;

                    container.appendChild(card);

                });

            } catch (error) {

                container.innerHTML = `
                    <p class="text-red-500">
                        Error al cargar productos
                    </p>
                `;

            }
        }

        // Ejecutar al cargar la página
        loadCategories();
        loadProducts2();
    </script>
</body>

</html>
