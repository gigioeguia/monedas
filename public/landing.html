<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Nuestras Categorías</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333;
            background: #f5f5f5;
        }

        header {
            background: #ffe600;
            padding: 16px 5%;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 24px;
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #222;
            white-space: nowrap;
        }

        .search {
            display: flex;
            flex: 1;
        }

        .search input {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 5px 0 0 5px;
            font-size: 15px;
        }

        .search button {
            padding: 0 18px;
            border: 0;
            border-radius: 0 5px 5px 0;
            background: #eee;
            cursor: pointer;
        }

        .account {
            white-space: nowrap;
            font-size: 14px;
        }

        nav {
            max-width: 1200px;
            margin: 14px auto 0;
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        nav a {
            color: #333;
            text-decoration: none;
        }

        main {
            max-width: 1200px;
            margin: 28px auto;
            padding: 0 16px;
        }

        .breadcrumbs {
            margin-bottom: 18px;
            color: #777;
            font-size: 14px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .card {
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 1px 4px #00000014;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 14px #0000001c;
        }

        .card img {
            display: block;
            width: 100%;
            height: 210px;
            object-fit: contain;
            padding: 16px;
            background: #fff;
        }

        .details {
            padding: 16px;
            border-top: 1px solid #eee;
        }

        .price {
            margin: 0 0 8px;
            font-size: 24px;
            color: #222;
        }

        .shipping {
            margin: 0 0 8px;
            color: #16834b;
            font-size: 14px;
            font-weight: bold;
        }

        .name {
            margin: 0;
            min-height: 40px;
            font-size: 15px;
            font-weight: normal;
            line-height: 1.4;
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 14px 16px;
            }

            .topbar {
                flex-wrap: wrap;
                gap: 12px;
            }

            .search {
                order: 3;
                flex-basis: 100%;
            }

            .account {
                margin-left: auto;
            }

            nav {
                overflow-x: auto;
                white-space: nowrap;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .card img {
                height: 240px;
            }
        }
    </style>

</head>

<body class="bg-slate-100 p-8">
    <main class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center">Explora nuestras categorías</h1>

        <div class="swiper categorySwiper">
            <div id="categories-container" class="swiper-wrapper">
                <div class="swiper-slide">
                    <p class="text-center">Cargando categorías...</p>
                </div>
            </div>

            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>

            <div class="swiper-pagination mt-4"></div>
        </div>

        <section class="mt-12">

            <h2 id="category-title" class="text-2xl font-bold mb-6">
                Productos destacados
            </h2>

            <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

                <p class="text-center col-span-full">
                    Selecciona una categoría
                </p>

            </div>

        </section>

        <section class="products mt-12" id="products" aria-label="Catálogo de productos" aria-live="polite">
            <p class="loading">Cargando productos…</p>
        </section>

    </main>

    <script>

        const productsContainer = document.querySelector('#products');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
            })[character]);
        }

        async function loadProducts2() {
            try {
                const response = await fetch('/api/get_categories2.php');

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const products = await response.json();

                if (!Array.isArray(products) || products.length === 0) {
                    productsContainer.innerHTML = '<p>No hay productos disponibles.</p>';
                    return;
                }

                productsContainer.innerHTML = products.map(product => {
                    const name = escapeHtml(product.name);
                    const price = Number(product.price);
                    const image = escapeHtml(product.image_url || 'https://placehold.co/400x300?text=Producto');

                    return `
                    <article class="card">
                        <img src="${image}" alt="${name}" loading="lazy">
                        <div class="details">
                        <p class="price">
                            ${Number.isFinite(price)
                            ? price.toLocaleString('es-MX', {
                                style: 'currency',
                                currency: 'MXN'
                                })
                            : 'Precio no disponible'}
                        </p>
                        <p class="shipping">Envío gratis</p>
                        <h2 class="name">${name}</h2>
                        </div>
                    </article>
                    `;
                }).join('');
            } catch (error) {
            console.error('No se pudieron cargar los productos:', error);
            productsContainer.innerHTML =
                '<p>No fue posible cargar el catálogo. Intenta de nuevo más tarde.</p>';
            }
        }

        // Función para consumir el servicio PHP
        async function loadCategories() {
            const container = document.getElementById('categories-container');

            try {
                const response = await fetch('api/get_categories.php');
                const categories = await response.json();

                if (categories.error) throw new Error(categories.error);

                container.innerHTML = ''; // Limpiar mensaje de carga

                if (categories.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center">No hay categorías disponibles.</p>';
                    return;
                }

                categories.forEach(cat => {

                    const slide = document.createElement('div');

                    slide.className = 'swiper-slide';

                    slide.dataset.id = cat.id;

                    slide.innerHTML = `
                        <article class="bg-white 
                            rounded-2xl 
                            shadow-lg 
                            hover:shadow-2xl 
                            transition-all 
                            duration-300 
                            overflow-hidden 
                            h-full 
                            min-h-[420px]">
                            ${cat.image_url
                            ? `<img
                                    src="${cat.image_url}"
                                    alt="${cat.name}"
                                    class="w-full h-64 object-cover"
                                >`
                            : ''}
                            <div class="p-5">
                                <h2 class="font-bold text-xl text-slate-800">
                                    ${cat.name}
                                </h2>

                                <p class="text-slate-600 mt-2">
                                    ${cat.description || ''}
                                </p>
                            </div>
                        </article>
                    `;
                    container.appendChild(slide);
                });

                const swiper = new Swiper('.categorySwiper', {

                    loop: true,
                    centeredSlides: true,

                    slidesPerView: 1,
                    spaceBetween: 30,

                    breakpoints: {
                        768: {
                            slidesPerView: 2
                        },
                        1200: {
                            slidesPerView: 3
                        }
                    },

                    effect: 'coverflow',

                    coverflowEffect: {
                        rotate: 0,
                        stretch: 0,
                        depth: 120,
                        modifier: 2,
                        slideShadows: false
                    },

                    pagination: {
                        el: '.swiper-pagination',
                        clickable: true
                    },

                    navigation: {
                        nextEl: '.swiper-button-next',
                        prevEl: '.swiper-button-prev'
                    },

                    on: {

                        init() {

                            const slide =
                                this.slides[this.activeIndex];

                            loadProducts(
                                slide.dataset.id
                            );

                        },

                        slideChangeTransitionEnd() {

                            const slide =
                                this.slides[this.activeIndex];

                            loadProducts(
                                slide.dataset.id
                            );

                        }

                    }

                });
            } catch (error) {
                container.innerHTML = `<p class="col-span-full text-center text-red-600">Error: ${error.message}</p>`;
            }
        }

        async function loadProducts(categoryId) {

            const container =
                document.getElementById('products-container');

            container.innerHTML = `
                <p class="col-span-full text-center">
                    Cargando artículos...
                </p>
            `;

            try {

                const response =
                    await fetch(
                        `api/get_products.php?category_id=${encodeURIComponent(categoryId)}`
                    );

                const products = await response.json();

                container.innerHTML = '';

                products.forEach(product => {

                    const card =
                        document.createElement('article');

                    card.className = `
                        bg-white
                        rounded-2xl
                        shadow-lg
                        overflow-hidden
                        hover:shadow-xl
                        transition
                    `;

                    card.innerHTML = `

                        ${product.image_url ? `
                            <img
                                src="${product.image_url}"
                                alt="${product.name}"
                                class="w-full h-56 object-cover">
                        ` : ''}

                        <div class="p-4">

                            <h3 class="font-bold text-lg">
                                ${product.name}
                            </h3>

                            <p class="text-slate-600 mt-2">
                                ${product.description || ''}
                            </p>

                            <p class="mt-4 text-xl font-bold text-blue-600">
                                $${product.price}
                            </p>

                        </div>
                    `;

                    container.appendChild(card);

                });

            } catch (error) {

                container.innerHTML = `
                    <p class="text-red-500">
                        Error al cargar productos
                    </p>
                `;

            }
        }

        // Ejecutar al cargar la página
        loadCategories();
        loadProducts2();
    </script>
</body>

</html>
